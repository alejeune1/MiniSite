<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Cours</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Fiche cours</h1>
    <p>Contenu detaille du cours.</p>
  </header>

  <div class="home-button-container">
    <a href="index.html" class="home-btn">Retour a l'accueil</a>
  </div>

  <main class="container">
    <section class="intro">
      <div id="course-loader" class="course-loader">
        <div class="skeleton-line skeleton-title"></div>
        <div class="skeleton-line"></div>
        <div class="skeleton-line skeleton-short"></div>
        <div class="skeleton-block"></div>
        <div class="skeleton-block"></div>
      </div>
      <div id="course-content" class="course-content hidden">
        <div id="course-header"></div>
        <p id="course-description" class="hidden"></p>
        <div id="course-meta" class="muted"></div>
        <div id="course-blocks"></div>
      </div>
      <p id="course-empty" class="muted hidden">Aucun contenu pour ce cours.</p>
      <div id="course-error" class="error-message hidden"></div>
    </section>
  </main>

  <footer>
    <p>Atelier pedagogique - aucune information n'est reellement envoyee.</p>
  </footer>

  <script>
    const headerEl = document.getElementById('course-header');
    const descriptionEl = document.getElementById('course-description');
    const metaEl = document.getElementById('course-meta');
    const blocksEl = document.getElementById('course-blocks');
    const loaderEl = document.getElementById('course-loader');
    const contentEl = document.getElementById('course-content');
    const emptyEl = document.getElementById('course-empty');
    const errorEl = document.getElementById('course-error');
    const COURSE_CACHE_PREFIX = 'course-prefetch-v1:';

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, '&#96;');
    }

    function showError(message) {
      errorEl.textContent = message;
      errorEl.classList.remove('hidden');
    }

    function clearStates() {
      errorEl.classList.add('hidden');
      emptyEl.classList.add('hidden');
      descriptionEl.classList.add('hidden');
    }

    function formatDate(isoDate) {
      if (!isoDate) {
        return '';
      }
      const parsed = new Date(isoDate);
      if (Number.isNaN(parsed.getTime())) {
        return '';
      }
      return parsed.toLocaleDateString('fr-FR', {
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });
    }

    function renderBlocks(blocks) {
      blocksEl.innerHTML = '';
      if (!Array.isArray(blocks) || blocks.length === 0) {
        emptyEl.classList.remove('hidden');
        return;
      }

      blocksEl.innerHTML = blocks.map((block) => {
        const type = block.type;
        const content = block.content || {};

        if (type === 'text') {
          return `
            <div class="block block-text">
              ${content.html || ''}
            </div>
          `;
        }

        if (type === 'image') {
          const url = content.url ? escapeAttr(content.url) : '';
          const caption = content.caption ? escapeHtml(content.caption) : '';
          return `
            <figure class="block block-image">
              ${url ? `<img src="${url}" alt="${caption}">` : ''}
              ${caption ? `<figcaption class="muted">${caption}</figcaption>` : ''}
            </figure>
          `;
        }

        if (type === 'links') {
          const items = Array.isArray(content.items) ? content.items : [];
          const list = items.map((item) => {
            const label = escapeHtml(item.label || item.url || 'Lien');
            const url = escapeAttr(item.url || '#');
            return `<li><a href="${url}" target="_blank" rel="noopener">${label}</a></li>`;
          }).join('');

          return `
            <div class="block block-links">
              <ul>
                ${list}
              </ul>
            </div>
          `;
        }

        return '';
      }).join('');
    }

    function showLoader() {
      loaderEl.classList.remove('hidden');
      contentEl.classList.add('hidden');
      contentEl.classList.remove('is-visible');
    }

    function showContent() {
      loaderEl.classList.add('hidden');
      contentEl.classList.remove('hidden');
      requestAnimationFrame(() => {
        contentEl.classList.add('is-visible');
      });
    }

    function readCourseCache(slug) {
      try {
        const raw = sessionStorage.getItem(`${COURSE_CACHE_PREFIX}${slug}`);
        if (!raw) {
          return null;
        }
        const cached = JSON.parse(raw);
        if (!cached || !cached.payload) {
          return null;
        }
        return cached.payload;
      } catch (error) {
        return null;
      }
    }

    function storeCourseCache(slug, payload) {
      try {
        sessionStorage.setItem(`${COURSE_CACHE_PREFIX}${slug}`, JSON.stringify({
          ts: Date.now(),
          payload
        }));
      } catch (error) {
        /* ignore storage errors */
      }
    }

    function renderCourse(payload) {
      const course = payload.course || {};
      const blocks = payload.blocks || [];

      const title = escapeHtml(course.title || 'Cours');
      const description = escapeHtml(course.description || '');
      const updatedAt = formatDate(course.updated_at);

      headerEl.innerHTML = `<h2>${title}</h2>`;
      metaEl.textContent = updatedAt ? `Mise a jour : ${updatedAt}` : '';

      if (description) {
        descriptionEl.textContent = description;
        descriptionEl.classList.remove('hidden');
      } else {
        descriptionEl.textContent = '';
        descriptionEl.classList.add('hidden');
      }

      renderBlocks(blocks);
    }

    async function loadCourse() {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug');

      if (!slug) {
        headerEl.innerHTML = '<h2>Cours introuvable</h2>';
        showError('Aucun identifiant de cours fourni.');
        return;
      }

      clearStates();
      showLoader();
      const cached = readCourseCache(slug);
      if (cached) {
        renderCourse(cached);
        showContent();
        return;
      }

      try {
        const response = await fetch(`/api/courses/${encodeURIComponent(slug)}`);
        if (response.status === 404) {
          headerEl.innerHTML = '<h2>Cours introuvable</h2>';
          showError('Ce cours est introuvable.');
          showContent();
          return;
        }
        if (!response.ok) {
          throw new Error('Erreur de chargement');
        }

        const payload = await response.json();
        renderCourse(payload);
        storeCourseCache(slug, payload);
        showContent();
      } catch (error) {
        headerEl.innerHTML = '<h2>Erreur</h2>';
        showError('Impossible de charger ce cours pour le moment.');
        showContent();
      }
    }

    loadCourse();
  </script>
</body>
</html>
